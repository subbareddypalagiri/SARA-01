<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selective Regenerate AI (SRA)</title>
  <style>
    :root {
      --bg: #f5efe6;
      --card-bg: #fdfbf7;
      --border: #dfd3c3;
      --text: #2b1d14;
      --text-muted: #7a6353;
      --accent: #7c4d28;
      --accent-hover: #5a3418;
      --accent-glow: rgba(124, 77, 40, 0.2);
      --success-bg: #eaf5eb;
      --success-text: #166534;
      --success-border: #86efac;
      --danger-bg: #fde8e8;
      --danger-text: #991b1b;
      --danger-border: #f87171;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Playfair Display', 'Georgia', 'Baskerville', 'Cambria', serif;
      -webkit-font-smoothing: antialiased;
    }
    
    body {
      width: 380px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(50, 34, 24, 0.15);
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .brand-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #7c4d28, #4a2810);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fdfbf7;
      box-shadow: 0 2px 8px rgba(74, 40, 16, 0.25);
    }
    
    .brand-title {
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #2b1d14;
    }
    
    .version-tag {
      font-size: 10px;
      font-weight: 600;
      color: #7c4d28;
      background: #f3e9db;
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .form-group {
      margin-bottom: 14px;
    }
    
    label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    input[type="password"],
    input[type="text"],
    select {
      width: 100%;
      padding: 9px 12px;
      background: #ffffff;
      border: 1px solid #ded2bf;
      border-radius: 7px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: all 0.18s ease;
    }
    
    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      margin-bottom: 14px;
    }
    
    button {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.18s ease;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .btn-save {
      background: linear-gradient(135deg, #7c4d28, #5a3418);
      color: white;
      box-shadow: 0 3px 10px rgba(74, 40, 16, 0.25);
    }
    
    .btn-save:hover {
      background: linear-gradient(135deg, #8f5a30, #6d3e1d);
      transform: translateY(-1px);
    }
    
    .btn-test {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .btn-test:hover {
      background: #f3e9db;
    }
    
    .btn-clear {
      flex: 0 0 auto;
      padding: 9px 10px;
      background: #fde8e8;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    
    .btn-clear:hover {
      background: #fca5a5;
    }
    
    .status {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 14px;
      display: none;
      line-height: 1.4;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .status.success {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
      display: block;
    }
    
    .status.error {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
      display: block;
    }
    
    .status.info {
      background: #f3e9db;
      color: #7c4d28;
      border: 1px solid #dfd3c3;
      display: block;
    }

    .features-list {
      background: #f8f4ec;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      margin-bottom: 14px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: #574133;
      margin-bottom: 6px;
    }
    .feature-item:last-child {
      margin-bottom: 0;
    }
    .feature-dot {
      color: #15803d;
      display: flex;
      font-weight: bold;
    }
    
    .footer {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .footer a {
      color: #7c4d28;
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
        </div>
        <div class="brand-title">Selective Regenerate AI</div>
      </div>
      <span class="version-tag">Classic Luxury</span>
    </div>
    
    <div id="status" class="status"></div>
    
    <div class="form-group">
      <label for="apiKey">Gemini API Key (BYOK)</label>
      <input
        type="password"
        id="apiKey"
        placeholder="Paste your Gemini API key (AIzaSy...)"
        autocomplete="off"
      >
    </div>

    <div class="form-group">
      <label for="modelSelect">Intelligence Engine</label>
      <div class="select-wrapper">
        <select id="modelSelect">
          <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Ultra-Fast & Stable)</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash (Legacy Fast)</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        </select>
      </div>
    </div>

    <div class="features-list">
      <div class="feature-item">
        <span class="feature-dot">✓</span>
        <span>Universal on <strong>ChatGPT</strong>, <strong>Claude</strong> & <strong>Gemini</strong></span>
      </div>
      <div class="feature-item">
        <span class="feature-dot">✓</span>
        <span>Auto-Rehydration (Edits survive F5 refresh)</span>
      </div>
      <div class="feature-item">
        <span class="feature-dot">✓</span>
        <span>Word-Level Visual Diff & 1-Click Rollback Undo</span>
      </div>
    </div>
    
    <div class="button-group">
      <button class="btn-save" id="saveBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span>Save Key</span>
      </button>
      <button class="btn-test" id="testBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>Test Link</span>
      </button>
      <button class="btn-clear" id="clearBtn" title="Clear Settings">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </button>
    </div>
    
    <div class="footer">
      Get your free API key at <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
